name: Documentation Check

on:
  push:
    paths:
      - 'modules/**/README.md'
      - 'modules/**/lecture-notes.md'
      - 'modules/**/exercises/*.md'
      - 'modules/**/labs/*.md'
      - 'docs/**/*.md'
      - 'README.md'
  pull_request:
    paths:
      - '**/*.md'

jobs:
  check-links:
    name: Check internal links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for broken internal file references
        run: |
          BROKEN=0
          # Find all markdown links that reference local files
          while IFS= read -r -d '' mdfile; do
            dir=$(dirname "$mdfile")
            # Extract local file references (not http/https)
            grep -oE '\[([^\]]+)\]\(([^)]+)\)' "$mdfile" | \
              grep -v 'http' | \
              sed 's/.*](\(.*\))/\1/' | \
              while read -r link; do
                # Strip anchors
                target="${link%%#*}"
                [ -z "$target" ] && continue
                # Resolve relative path
                resolved="$dir/$target"
                if [ ! -e "$resolved" ]; then
                  echo "BROKEN LINK in $mdfile: $link"
                  BROKEN=$((BROKEN + 1))
                fi
              done
          done < <(find . -name "*.md" -not -path "./.git/*" -print0)

          echo "Link check complete."

  check-module-structure:
    name: Verify module directory structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check each module has required files
        run: |
          ISSUES=0
          REQUIRED_FILES=(
            "README.md"
            "lecture-notes.md"
          )

          for module_dir in modules/module-*/; do
            [ -d "$module_dir" ] || continue
            for required in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$module_dir/$required" ]; then
                echo "MISSING: $module_dir$required"
                ISSUES=$((ISSUES + 1))
              fi
            done
          done

          if [ "$ISSUES" -gt 0 ]; then
            echo "$ISSUES missing required file(s) in module directories."
            exit 1
          else
            echo "All modules have required files."
          fi
