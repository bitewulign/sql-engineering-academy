name: Content Request
description: Suggest a new exercise, example, or module improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a suggestion for an exercise, a better explanation, or an additional example? We'd love to hear it.

  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New exercise
        - New challenge
        - Better explanation
        - Additional code example
        - New module suggestion
        - Translation
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Module or file (if applicable)
      placeholder: "modules/module-01/exercises/exercises-01.md"

  - type: textarea
    id: description
    attributes:
      label: Describe what you would like
      description: Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this help learners?
      description: What gap does it fill or what concept does it reinforce?
